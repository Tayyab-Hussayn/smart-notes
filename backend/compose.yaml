# Local development only. PostgreSQL is not published to the host network.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SMART_STICKY_ENV: development
      SMART_STICKY_ALLOWED_HOSTS: localhost,127.0.0.1
      SMART_STICKY_DATABASE_URL: ${SMART_STICKY_DEV_DATABASE_URL:?Set PostgreSQL URL using database host and URL-encoded credentials}
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: smart_sticky_dev
      POSTGRES_USER: smart_sticky_dev
      POSTGRES_PASSWORD: ${SMART_STICKY_DEV_DB_PASSWORD:?Set a local development database password}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_sticky_dev -d smart_sticky_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  database_data:
